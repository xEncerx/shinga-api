version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: shinga-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - shinga-network
    restart: unless-stopped

  api:
    build: .
    container_name: shinga-api
    command: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ${MEDIA_STORAGE_PATH:-/var/www/shinga/media}:${MEDIA_STORAGE_PATH:-/var/www/shinga/media}
      - ./temp:/app/temp
    depends_on:
      - redis
    networks:
      - shinga-network
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: shinga-celery-beat
    command: celery -A app.tasks.celery_app beat
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST}
    volumes:
      - ./logs:/app/logs
      - ${MEDIA_STORAGE_PATH:-/var/www/shinga/media}:${MEDIA_STORAGE_PATH:-/var/www/shinga/media}
      - ./temp:/app/temp
    depends_on:
      - redis
    networks:
      - shinga-network
    restart: unless-stopped

  celery-worker-main:
    build: .
    container_name: shinga-celery-main
    command: >
      celery -A app.tasks.celery_app worker
      -Q scraping,consolidation,refresh_titles
      -n main@%h
      --concurrency=4
      --autoscale=6,2
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST}
      - PYTHONUNBUFFERED=1
      - PYTHONMALLOC=malloc
    volumes:
      - ./logs:/app/logs
      - ${MEDIA_STORAGE_PATH:-/var/www/shinga/media}:${MEDIA_STORAGE_PATH:-/var/www/shinga/media}
      - ./temp:/app/temp
    depends_on:
      - redis
    networks:
      - shinga-network
    restart: unless-stopped

  celery-worker-media:
    build: .
    container_name: shinga-celery-media
    command: >
      celery -A app.tasks.celery_app worker
      -Q download_media
      -n download_media@%h
      --concurrency=4
      --autoscale=6,2
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST}
      - PYTHONUNBUFFERED=1
      - PYTHONMALLOC=malloc
    volumes:
      - ./logs:/app/logs
      - ${MEDIA_STORAGE_PATH:-/var/www/shinga/media}:${MEDIA_STORAGE_PATH:-/var/www/shinga/media}
      - ./temp:/app/temp
    depends_on:
      - redis
    networks:
      - shinga-network
    restart: unless-stopped

  celery-worker-monitoring:
    build: .
    container_name: shinga-celery-monitoring
    command: >
      celery -A app.tasks.celery_app worker
      -Q monitoring
      -n monitoring@%h
      --concurrency=1
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=${POSTGRES_HOST}
    volumes:
      - ./logs:/app/logs
      - ${MEDIA_STORAGE_PATH:-/var/www/shinga/media}:${MEDIA_STORAGE_PATH:-/var/www/shinga/media}
      - ./temp:/app/temp
    depends_on:
      - redis
    networks:
      - shinga-network
    restart: unless-stopped

  flower:
    build: .
    container_name: shinga-flower
    command: >
      celery -A app.tasks.celery_app flower 
      --port=5555
      --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - redis
    ports:
      - "5555:5555"
    networks:
      - shinga-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  redis_data:

networks:
  shinga-network:
    driver: bridge
